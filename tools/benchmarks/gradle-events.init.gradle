import groovy.json.JsonOutput

// Task outcomes only: never record environment variables, inputs or credentials.
def destination = System.getenv('EXPBUILD_BENCH_EVENTS')
if (destination) {
    def events = new File(destination)
    events.parentFile.mkdirs()
    def lock = new Object()
    new File(destination + '.jvm.json').text = JsonOutput.toJson([
        pid: ProcessHandle.current().pid(),
        javaVersion: System.getProperty('java.version'),
        javaVendor: System.getProperty('java.vendor'),
        javaHome: System.getProperty('java.home'),
        gradleVersion: gradle.gradleVersion,
    ])
    gradle.taskGraph.afterTask { task, state ->
        def event = [task: task.path, skipped: state.skipped,
                     skipMessage: state.skipMessage, didWork: state.didWork,
                     failed: state.failure != null]
        synchronized (lock) {
            events << JsonOutput.toJson(event) + '\n'
        }
    }
}
