name: Isolated Kubernetes lifecycle
on:
  push:
    paths: ['operator/**', 'apps/**', 'images/**', 'package*.json', '.dockerignore', 'deploy/charts/**', 'tools/helm_lifecycle.py', 'tools/gateway_fixture.py', 'tools/test_gateway_fixture.py', 'tools/monitoring_fixture.py', 'tools/network_fixture.py', 'tools/cluster_lifecycle.py', 'tools/container_smoke.py', '.github/workflows/cluster.yml']
  pull_request:
    paths: ['operator/**', 'apps/**', 'images/**', 'package*.json', '.dockerignore', 'deploy/charts/**', 'tools/helm_lifecycle.py', 'tools/gateway_fixture.py', 'tools/test_gateway_fixture.py', 'tools/monitoring_fixture.py', 'tools/network_fixture.py', 'tools/cluster_lifecycle.py', 'tools/container_smoke.py', '.github/workflows/cluster.yml']
permissions:
  contents: read
jobs:
  webdav:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/test_gateway_fixture.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: operator/go.sum
      - run: go install sigs.k8s.io/kind@v0.27.0
      - name: Install matching kubectl
        run: |
          curl -fsSLo "$RUNNER_TEMP/kubectl" https://dl.k8s.io/release/v1.32.2/bin/linux/amd64/kubectl
          curl -fsSLo "$RUNNER_TEMP/kubectl.sha256" https://dl.k8s.io/release/v1.32.2/bin/linux/amd64/kubectl.sha256
          cd "$RUNNER_TEMP"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kubectl
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/operator/Dockerfile
          load: true
          push: false
          tags: expbuild/operator:test
          cache-from: type=gha,scope=operator
          cache-to: type=gha,mode=max,scope=operator
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/gradle-cache/Dockerfile
          load: true
          push: false
          tags: expbuild/gradle-cache:test
          cache-from: type=gha,scope=gradle-cache
          cache-to: type=gha,mode=max,scope=gradle-cache
      - name: Verify WebDAV and Gradle lifecycle on a disposable kind cluster
        run: python3 tools/cluster_lifecycle.py
  helm:
    strategy:
      fail-fast: false
      matrix:
        mode: [internal, gateway, isolation]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/test_gateway_fixture.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: operator/go.sum
      - run: go install sigs.k8s.io/kind@v0.27.0
      - name: Install matching kubectl
        run: |
          curl -fsSLo "$RUNNER_TEMP/kubectl" https://dl.k8s.io/release/v1.32.2/bin/linux/amd64/kubectl
          curl -fsSLo "$RUNNER_TEMP/kubectl.sha256" https://dl.k8s.io/release/v1.32.2/bin/linux/amd64/kubectl.sha256
          cd "$RUNNER_TEMP"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kubectl
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/operator/Dockerfile
          load: true
          push: false
          tags: expbuild/operator:test
          cache-from: type=gha,scope=operator
          cache-to: type=gha,mode=max,scope=operator
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/admin-api/Dockerfile
          load: true
          push: false
          tags: expbuild/admin-api:test
          cache-from: type=gha,scope=admin-api
          cache-to: type=gha,mode=max,scope=admin-api
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/admin-web/Dockerfile
          load: true
          push: false
          tags: expbuild/admin-web:test
          cache-from: type=gha,scope=admin-web
          cache-to: type=gha,mode=max,scope=admin-web
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Verify Helm and management API on a disposable kind cluster
        env:
          TEST_MODE: ${{ matrix.mode }}
        run: |
          if [ "$TEST_MODE" = isolation ]; then
            python3 tools/helm_lifecycle.py --gateway --isolation
          elif [ "$TEST_MODE" = gateway ]; then
            python3 tools/helm_lifecycle.py --gateway
          else
            python3 tools/helm_lifecycle.py
          fi
