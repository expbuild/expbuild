name: Management API
on:
  push:
    paths: ['tests/browser/**', 'tests/contracts/**', 'apps/**', 'package.json', 'package-lock.json', 'tools/download_prometheus.py', 'tools/download_observability_backend.py', '.github/workflows/admin-api.yml']
  pull_request:
    paths: ['tests/browser/**', 'tests/contracts/**', 'apps/**', 'package.json', 'package-lock.json', 'tools/download_prometheus.py', 'tools/download_observability_backend.py', '.github/workflows/admin-api.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: expbuild
          POSTGRES_PASSWORD: integration-test-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U expbuild"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://expbuild:integration-test-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install pinned Prometheus test fixture
        run: |
          python3 tools/download_prometheus.py "$RUNNER_TEMP/prometheus"
          python3 tools/download_observability_backend.py alertmanager "$RUNNER_TEMP/alertmanager"
          python3 tools/download_observability_backend.py loki "$RUNNER_TEMP/loki"
      - run: npm test
        env:
          PROMETHEUS_BIN: ${{ runner.temp }}/prometheus
          ALERTMANAGER_BIN: ${{ runner.temp }}/alertmanager
          LOKI_BIN: ${{ runner.temp }}/loki
      - name: Install Chromium for browser acceptance
        run: npx playwright install --with-deps chromium --only-shell
      - name: Verify browser, production UI and real API/database
        run: npm run test:browser
