name: Management API
on:
  push:
    paths: ['apps/**', 'package.json', 'package-lock.json', '.github/workflows/admin-api.yml']
  pull_request:
    paths: ['apps/**', 'package.json', 'package-lock.json', '.github/workflows/admin-api.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: expbuild
          POSTGRES_PASSWORD: integration-test-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U expbuild"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://expbuild:integration-test-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
